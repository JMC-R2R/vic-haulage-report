<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vic. Haulage Co. — Google Ads Reports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#17B4F0;
    --ink:#0B0E11;
    --ink2:#11161B;
    --panel:#161C22;
    --line:#222B33;
    --text:#E8EDF1;
    --muted:#8A98A5;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:'Archivo',system-ui,sans-serif;
    display:flex;flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'Space Mono',monospace}

  .topbar{
    flex:0 0 auto;
    background:linear-gradient(180deg,#0E141A 0%, #0B0E11 100%);
    border-bottom:1px solid var(--line);
    padding:14px 26px 0;
  }
  .topbar-row{
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    max-width:1180px;margin:0 auto;
  }
  .brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:.02em;font-size:15px}
  .brand .dot{width:11px;height:11px;border-radius:50%;background:var(--blue);box-shadow:0 0 16px var(--blue);flex:0 0 auto}
  .brand small{display:block;color:var(--muted);font-weight:600;font-size:10px;letter-spacing:.18em;text-transform:uppercase}
  .client{
    color:var(--muted);font-size:13px;padding-left:18px;border-left:1px solid var(--line);
    font-family:'Space Mono',monospace;letter-spacing:.04em;
  }
  .client b{color:var(--text);font-weight:700}
  .pdflink{
    margin-left:auto;display:inline-flex;align-items:center;gap:8px;text-decoration:none;
    color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:9px 15px;font-size:13px;font-weight:600;transition:.18s;white-space:nowrap;
  }
  .pdflink:hover{border-color:var(--blue);color:var(--blue)}

  .tabs{
    display:flex;gap:6px;max-width:1180px;margin:14px auto 0;overflow-x:auto;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    appearance:none;border:1px solid var(--line);border-bottom:none;background:transparent;
    color:var(--muted);font-family:'Space Mono',monospace;font-size:13px;letter-spacing:.06em;
    padding:11px 20px;border-radius:10px 10px 0 0;cursor:pointer;transition:.16s;white-space:nowrap;
    text-transform:uppercase;font-weight:700;position:relative;top:1px;
  }
  .tab:hover{color:var(--text);background:rgba(23,180,240,.05)}
  .tab[aria-selected="true"]{
    background:var(--ink);color:var(--blue);border-color:var(--line);
    box-shadow:inset 0 2px 0 var(--blue);
  }

  .frame-wrap{flex:1 1 auto;position:relative;min-height:0}
  iframe{width:100%;height:100%;border:0;display:block;background:var(--ink)}

  .empty{
    display:flex;align-items:center;justify-content:center;height:100%;
    color:var(--muted);font-family:'Space Mono',monospace;font-size:14px;
  }

  @media(max-width:640px){
    .topbar{padding:12px 16px 0}
    .client{display:none}
    .pdflink{padding:8px 12px;font-size:12px}
    .tab{padding:10px 15px;font-size:12px}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-row">
    <div class="brand">
      <span class="dot"></span>
      <div>Ready to Rank<small>Digital Marketing</small></div>
    </div>
    <div class="client">Vic. Haulage&nbsp;Co. · <b>Google Ads</b></div>
    <a class="pdflink" id="pdflink" href="#" download>⬇ Download PDF</a>
  </div>
  <div class="tabs" id="tabs" role="tablist"></div>
</div>

<div class="frame-wrap">
  <iframe id="frame" title="Monthly report"></iframe>
</div>

<script>
  /* ---------------------------------------------------------------
     MONTHS — newest first. To add a month, insert one object at the
     top of this array. Nothing else in this file needs to change.
     --------------------------------------------------------------- */
  const MONTHS = [
    /* MONTHS:START */
    { id:'2026-08', label:'Aug 2026', file:'reports/2026-08.html', pdf:'Vic-Haulage-Google-Ads-Report-Aug2026.pdf' },
    { id:'2026-07', label:'Jul 2026', file:'reports/2026-07.html', pdf:'Vic-Haulage-Google-Ads-Report-Jul2026.pdf' },
    { id:'2026-06', label:'Jun 2026', file:'reports/2026-06.html', pdf:'Vic-Haulage-Google-Ads-Report-Jun2026.pdf' }
    /* MONTHS:END */
  ];

  const tabsEl = document.getElementById('tabs');
  const frameEl = document.getElementById('frame');
  const pdfEl = document.getElementById('pdflink');

  function select(id, push){
    const m = MONTHS.find(x => x.id === id) || MONTHS[0];
    if(!m) return;
    frameEl.src = m.file;
    frameEl.title = 'Vic. Haulage Co. — ' + m.label + ' report';
    if(m.pdf){ pdfEl.href = m.pdf; pdfEl.style.display = ''; }
    else { pdfEl.style.display = 'none'; }
    [...tabsEl.children].forEach(b =>
      b.setAttribute('aria-selected', String(b.dataset.id === m.id))
    );
    if(push && location.hash !== '#' + m.id){
      history.replaceState(null, '', '#' + m.id);
    }
  }

  if(!MONTHS.length){
    document.querySelector('.frame-wrap').innerHTML =
      '<div class="empty">No reports published yet.</div>';
  } else {
    MONTHS.forEach(m => {
      const b = document.createElement('button');
      b.className = 'tab';
      b.type = 'button';
      b.role = 'tab';
      b.dataset.id = m.id;
      b.textContent = m.label;
      b.setAttribute('aria-selected','false');
      b.addEventListener('click', () => select(m.id, true));
      tabsEl.appendChild(b);
    });

    const fromHash = location.hash.replace('#','');
    select(MONTHS.some(m => m.id === fromHash) ? fromHash : MONTHS[0].id, false);

    window.addEventListener('hashchange', () => {
      const h = location.hash.replace('#','');
      if(MONTHS.some(m => m.id === h)) select(h, false);
    });
  }
</script>
</body>
</html>
